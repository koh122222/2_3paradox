 hint_mrb13_vijayanagar_institution_research: "Освоение институтов"
 mrb13_asia_institutions.1.title: "Освоение институтов"
 mrb13_asia_institutions.1.desc: "Обычное распространение институтов в наших землях перекрыто. Мы начнем самостоятельную программу освоения институтов. Первый этап занимает 200 лет без уступок; каждый следующий этап короче предыдущего на 20%."
 mrb13_asia_institutions.1.a: "Начать программу"
 mrb13_asia_institutions.2.title: "Этап освоения завершен"
 mrb13_asia_institutions.2.desc: "Все институты завершенного этапа получат полное распространение в наших владениях и будут приняты в конце месяца."
 mrb13_asia_institutions.2.a: "Продолжить программу"
 mrb13_asia_research_overview: "Данное событие заменяет распространение институтов в отдельной стране в азии. По окончанию этапа все институты указанной эпохи будут приняты. Уступки ускорят принятие эпохи. Каждая следующая эпоха проходит быстрее, но не начинается пока не будет закончена прошлая."
