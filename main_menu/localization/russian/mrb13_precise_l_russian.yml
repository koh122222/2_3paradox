 mrb13_second_sevastopol.1.title: "Второй Севастопольский процесс"
 mrb13_second_sevastopol.1.desc: "Проводим между Русским Царём, Турецким султаном, Императором СРИ и Шведским королём Второй Севастопольский процесс.\n\nЭто последнее восстановление Польши: все четыре стороны обязуются поддержать её, если это потребуется вновь. Польша может вернуть земли с польским и галицким населением, а также получить 12 500 монет на восстановление, из которых 1 500 сразу передаются Австрии. По желанию польского короля 1 000 монет могут быть заменены списанием одной привилегии.\n\nРусское Царство обозначает свой суверенитет над Молдовой, Подольем, Правобережной и Левобережной Украиной, а также частями Чёрной Руси и Полесья. Червона Русь, Волынь и остальное признаются сферой польского суверенитета.\n\nАвстрия признаёт Силезию польской; за каждый район СРИ, занятый Польшей, она получает по 100 монет. Польша отказывается от притязаний на Богемию, Моравию и Словакию, а Австрия поддерживает её суверенитет над прочими немецкими землями до Одера.\n\nШвеция получает признание суверенитета над балтийским побережьем СРИ к западу от Одера, Эстонией, Латвией, Литвой и Самогитией. Польский суверенитет над Пруссией признаётся неоспоримым.\n\nПольша принимает нейтральный внеблоковый статус и не участвует в войнах против основных инициаторов до 1600 года; после этого она возвращает право независимой дипломатии."
 mrb13_second_sevastopol.1.a: "Подтвердить Севастопольский договор"
