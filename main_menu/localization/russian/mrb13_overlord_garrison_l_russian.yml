l_russian:
 mrb13_overlord_garrison: "Гарнизон сюзерена"
 mrb13_overlord_garrison_desc: "Иностранный военный форпост, который сюзерен может построить только в локации своего субъекта. Занимает 100 солдат, при постройке понижает ранг локации до сельского поселения и запрещает дальнейшее повышение ранга."
 mrb13_overlord_garrison_maintenance: "Содержание гарнизона сюзерена"
 mrb13_overlord_garrison_maintenance_desc: "Потребляет 0,5 оружия и 0,5 ткани."
