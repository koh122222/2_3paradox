l_russian:
 mrb2_persia.1.title: "Берега Ормузского пролива"
 mrb2_persia.1.desc: "Ормуз готовит решительное объединение южной Персии и побережья Мекрана. Местные правители склоняются перед нашей властью, а их земли будут включены в державу как национальные владения."
 mrb2_persia.1.a: "Объединить южную Персию"
 mrb2_persia.2.title: "Восстановление Персии"
 mrb2_persia.2.desc: "Персидские земли вновь объединены, а ко двору прибывает учёный богослов. Его совет открывает путь к укреплению единой державы и утверждению новой веры."
 mrb2_persia.2.a: "Провозгласить шиизм"
 mrb2_persia.2.b: "Сохранить нынешнюю веру"
 mrb2_ormuz_absorb_persian_neighbors_tt: "Джарваниды будут освобождены из вассалитета и получат ормузские земли в Аравии. Ормуз присоединит и национализирует Мекран, Ларестан, Фаль, Джаск, Хондж, Джурманидскую Орду, Уганидскую Орду, Шабанкару, Керман, Бемпур, Буледу и Колву."
 mrb2_persian_restoration: "Возрождение Персии"
 mrb2_persian_restoration_desc: "Ормуз начинает путь от торговой державы пролива к восстановлению персидской державности."
 hint_mrb2_persian_restoration: "Возрождение Персии"
 mrb2_persian_restoration_overview: "Ормуз начинает игру с особой ситуацией, которая ведет его к объединению персидских земель. Первый этап помогает покорить регион Персии, а после создания Персии ситуация переходит к восстановлению державы."
 mrb2_persian_restoration_stages: "Этапы Возрождения Персии"
 mrb2_persian_restoration_stage_progress: "Этапы"
 mrb2_persian_restoration_current_stage: "Текущий этап"
