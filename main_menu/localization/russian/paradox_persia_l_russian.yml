 mrb2_persia_stage_1_cb_effect: "Доступен постоянный повод войны «Объединение Персии» против держав с землями в регионе Персии."
 mrb2_persia_stage_1: "Этап 1: Объединение Персии"
 mrb2_persia_stage_1_status_active: "Текущий этап"
 mrb2_persia_stage_1_status_done: "Завершено"
 mrb2_persia_stage_1_desc: "Пока Персия не создана: районы в регионе Персии под нашим контролем получают +50% к максимальному контролю и -50% сепаратизма; также доступен постоянный повод войны «Объединение Персии»."
 mrb2_persia_stage_2: "Этап 2: Восстановление Персии"
