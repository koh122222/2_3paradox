l_russian:
 ask_clergy_for_legitimacy_desc: "Попросите духовенство провести церемонии и публично поддержать правителя. Даёт #Y 7,5#! [Concept('legitimacy', 'легитимности')|e] за счёт [Concept('estate_satisfaction', 'довольства')|e] духовенства. Доступно раз в 10 лет."
 ask_burghers_for_loan_desc: "Попросите горожан об экстренном гранте из их собственной казны. Короне будет перечислено до #Y 25%#! золота горожан, а их [Concept('estate_satisfaction', 'довольство')|e] снизится на #R 25%#!. Доступно раз в 10 лет. В отличие от займа, это не расходует [Concept('loan', 'заёмный потенциал')|e]."
 ask_commoners_for_stability_desc: "Попросите простолюдинов провести общественные мероприятия, чтобы снизить волнения и успокоить население. Даёт #Y 5#! [Concept('stability', 'стабильности')|e] за счёт [Concept('estate_satisfaction', 'довольства')|e] простолюдинов или зимми."
