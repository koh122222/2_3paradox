 mrb13_asia_institutions.1.title: "Institutional Development"
 mrb13_asia_institutions.1.desc: "The normal spread of institutions is blocked in our lands. We will begin an independent programme of institutional development. The first stage takes 200 years without sacrifices; each following stage is 20% shorter."
 mrb13_asia_institutions.1.a: "Begin the programme"
 mrb13_asia_institutions.2.title: "Development Stage Completed"
 mrb13_asia_institutions.2.desc: "Every institution of the completed stage will gain full progress in our lands and be embraced at the end of the month."
 mrb13_asia_institutions.2.a: "Continue the programme"
 mrb13_asia_research_overview: "This situation replaces institution spread for an individual Asian country. Once a stage is complete, all institutions from its specified age are adopted. Concessions accelerate adoption of the age. Each following age proceeds faster, but cannot begin until the previous one is complete."
