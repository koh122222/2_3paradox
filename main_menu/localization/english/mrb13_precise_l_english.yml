 mrb13_second_sevastopol.1.title: "Second Sevastopol Process"
 mrb13_second_sevastopol.1.desc: "The Tsar of Russia, the Ottoman Sultan, the Holy Roman Emperor, and the Swedish King convene the Second Sevastopol Process.\n\nThis is the final restoration of Poland: all four sides undertake to support it should it be necessary again. Poland may recover lands with Polish and Galician populations and receive 12,500 gold for reconstruction, of which 1,500 is transferred to Austria at once. At the Polish king's discretion, 1,000 gold may be replaced by the revocation of one privilege.\n\nThe Russian Tsardom asserts sovereignty over Moldavia, Podolia, Right-bank and Left-bank Ukraine, and parts of Black Ruthenia and Polesia. Red Ruthenia, Volhynia, and the remainder are recognised as within Polish sovereignty.\n\nAustria recognises Silesia as Polish; Poland pays Austria 100 gold for every HRE area it occupies. Poland renounces claims to Bohemia, Moravia, and Slovakia, while Austria supports its sovereignty over the remaining German lands up to the Oder.\n\nSweden receives recognition of sovereignty over the Baltic HRE coast west of the Oder, Estonia, Latvia, Lithuania, and Samogitia. Polish sovereignty over Prussia is recognised as indisputable.\n\nPoland adopts a neutral non-aligned status and may not join wars against the principal initiators until 1600; afterwards it regains independent diplomacy."
 mrb13_second_sevastopol.1.a: "Confirm the Sevastopol Treaty"
