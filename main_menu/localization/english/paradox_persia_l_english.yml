l_english:
 mrb2_persia.1.title: "The Shores of Hormuz"
 mrb2_persia.1.desc: "Hormuz prepares a decisive unification of southern Persia and the Makran coast. Local rulers bend to our authority, and their lands will be incorporated as national possessions."
 mrb2_persia.1.a: "Unify southern Persia"
 mrb2_persia.2.title: "The Restoration of Persia"
 mrb2_persia.2.desc: "The Persian lands are united once more, and a learned theologian arrives at court. His counsel offers a path to strengthen the restored realm and establish a new faith."
 mrb2_persia.2.a: "Proclaim Shiism"
 mrb2_persia.2.b: "Preserve the current faith"
 mrb2_ormuz_absorb_persian_neighbors_tt: "The Jarwanids will be released from vassalage and receive the Hormuzi lands in Arabia. Hormuz will annex and nationalize Makran, Larestan, Fal, Jask, Khunj, the Jurmanid Horde, the Ughanid Horde, Shabankara, Kerman, Bampur, Buleda, and Kolwa."
 mrb2_persian_restoration: "Persian Restoration"
 mrb2_persian_restoration_desc: "Hormuz begins the path from a strait trading power to the restoration of Persian statehood."
 hint_mrb2_persian_restoration: "Persian Restoration"
 mrb2_persian_restoration_overview: "Hormuz begins with a special situation that guides it toward unifying the Persian lands. The first stage supports conquest in the Persia region, and once Persia is formed the situation moves into restoration."
